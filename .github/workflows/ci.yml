name: CI

# Every push to main and every pull request. The other workflow in this
# directory (python-publish.yml) only builds a release on tag, so nothing here
# ran a test or a linter before this file existed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older run — but only for the same
# commit. Grouping by ref alone let a late-queued run for an OLDER commit cancel
# a newer one that was already in progress, which turned a green run red.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('requirements-dev.txt') }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint agent/, server/, backend/, tests/, scripts/
        run: ruff check . --output-format=github

      - name: Check formatting is stable (non-blocking while the tree is cleaned up)
        run: ruff format --check . || true

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-types-${{ hashFiles('requirements-dev.txt') }}

      - name: Install dependencies and mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Scope and settings live in [tool.mypy] in pyproject.toml.
      - name: Type check agent/, server/, backend/app/
        run: mypy

  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ matrix.python-version }}-${{ hashFiles('requirements-lock.txt') }}

      # requirements-dev.txt pins via the lockfile (so the set is reproducible)
      # and adds the backend's own dependencies. Installing the lockfile alone
      # left sqlmodel and cryptography out, so backend/app/db.py could not be
      # imported and backend/tests only passed because nothing imported it.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Fail here, clearly, if the environment is missing a package the app
      # imports — otherwise it surfaces as a confusing test failure further down.
      - name: Verify the app imports with this dependency set
        run: |
          python -c "import sqlmodel, cryptography, fastapi, pytest; print('core deps present')"
          python -c "import backend.app.db; print('backend.app.db imports')"

      # No --maxfail: a red build must report every failure. With --maxfail=1 a
      # single early failure hides the remaining ~450 tests, so a run reading
      # "1 failed, 41 passed, 3 skipped" says nothing about the rest of the suite.
      - name: Run the test suite
        run: pytest tests/ backend/tests/ -v

  # A clone with nothing configured must still install and pass. This is the job
  # that would have caught the suite not being runnable at all.
  fresh-clone:
    name: fresh clone, documented commands only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: make install
        run: make install

      - name: make test
        run: make test

      - name: make lint
        run: make lint

      - name: make type
        run: make type
